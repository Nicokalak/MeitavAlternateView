<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Meitav Portfolio Viewer</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest" crossorigin="use-credentials">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-table-sticky-header.min.css">
    <link rel="stylesheet" href="css/bootstrap-icons.css">
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap-table.min.css">
    <link rel="stylesheet" href="css/main.css" />

<body>
    <input type="search" id="customSearch" class="form-control">
    <div class="container-fluid">
        <!-- Sticky Market Status Header -->
        <div id="market-status-container" class="sticky-top bg-body py-2 z-3">
            <h2 class="m-0 placeholder-glow" id="market_status"><span class="placeholder col-3 rounded"></span></h2>
        </div>
        <!-- Non-sticky top section: Market stats and Trends chart (scrolls away) -->
        <div class="row pt-2">
            <div class="col-12">
                <div id="market-stats" class="d-flex flex-wrap gap-2">
                    <!-- gainer/% -->
                    <div class="card flex-fill placeholder-glow" style="min-width:130px">
                        <div class="card-body p-2 text-center">
                            <span class="fw-semibold text-success" id="top-gainer"><span
                                    class="placeholder col-5 rounded"></span></span>
                            <span class="text-body-secondary"> / </span>
                            <span class="fw-semibold text-success" id="top-gainer-percent"><span
                                    class="placeholder col-5 rounded"></span></span>
                        </div>
                        <div class="card-footer py-1 text-center text-body-secondary small">Gainer ($) / (%)</div>
                    </div>
                    <!-- loser/% -->
                    <div class="card flex-fill placeholder-glow" style="min-width:130px">
                        <div class="card-body p-2 text-center">
                            <span class="fw-semibold text-danger" id="top-loser"><span
                                    class="placeholder col-5 rounded"></span></span>
                            <span class="text-body-secondary"> / </span>
                            <span class="fw-semibold text-danger" id="top-loser-percent"><span
                                    class="placeholder col-5 rounded"></span></span>
                        </div>
                        <div class="card-footer py-1 text-center text-body-secondary small">Loser ($) / (%)</div>
                    </div>
                    <!-- mover/trending -->
                    <div class="card flex-fill placeholder-glow" style="min-width:130px">
                        <div class="card-body p-2 text-center">
                            <span class="fw-semibold" id="top-mover"><span
                                    class="placeholder col-4 rounded"></span></span>
                            <span class="text-body-secondary"> / </span>
                            <span class="fw-semibold" id="trending"><span
                                    class="placeholder col-4 rounded"></span></span>
                        </div>
                        <div class="card-footer py-1 text-center text-body-secondary small">Mover / Trending</div>
                    </div>
                    <!-- watchlist -->
                    <div class="card flex-fill placeholder-glow" style="min-width:90px">
                        <div class="card-body p-2 text-center">
                            <span class="fw-semibold text-info" id="watchlist-trend"><span
                                    class="placeholder col-6 rounded"></span></span>
                        </div>
                        <div class="card-footer py-1 text-center text-body-secondary small">Watchlist</div>
                    </div>
                    <!-- +/- -->
                    <div class="card flex-fill placeholder-glow" style="min-width:90px">
                        <div class="card-body p-2 text-center" id="up-down">
                            <span class="fw-semibold text-success"><span
                                    class="placeholder col-3 rounded"></span></span>
                            <span class="text-body-secondary"> / </span>
                            <span class="fw-semibold text-danger"><span class="placeholder col-3 rounded"></span></span>
                        </div>
                        <div class="card-footer py-1 text-center text-body-secondary small">+/-</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-12">
                <canvas id="trends"></canvas>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <table class="table-sm table-striped caption-top" id="table" data-auto-refresh="true"
                    data-auto-refresh-interval="300" data-auto-refresh-status="false" data-url="portfolio"
                    data-show-refresh="true" data-show-columns-toggle-all="true" data-show-columns="true"
                    data-search="true" data-show-footer="true" data-sort-name="percent_change" data-detail-view="true"
                    data-detail-view-icon="true" data-detail-formatter="detailFormatter" data-show-export="true"
                    data-buttons-align="start" data-regex-search="true" data-search-selector="#customSearch"
                    data-sort-order="desc" data-row-style="watchListStyle" data-buttons="buttons"
                    data-buttons-prefix="btn-sm btn" data-sticky-header="true">
                    <thead>
                        <tr>
                            <th data-field="symbol" data-formatter="symbolFormatter" data-sortable="true">Symbol</th>
                            <th data-field="percent_change" data-footer-formatter="totalDayPercent"
                                data-formatter="roundPercent" data-cell-style="cellStyle" data-sortable="true">% Change
                            </th>
                            <th data-visible="false" data-field="principle_change" data-footer-formatter="totalPercent"
                                data-formatter="roundPercent" data-cell-style="cellStyle" data-sortable="true">% PChange
                            </th>
                            <th data-visible="false" data-field="change" data-formatter="round"
                                data-cell-style="cellStyle" data-sortable="true">Change</th>
                            <th data-field="last_price" data-formatter="round" data-sortable="true">Last</th>
                            <th data-field="cost" data-formatter="round" data-sortable="true">Cost</th>
                            <th data-visible="false" data-field="total_cost" data-sortable="true"
                                data-formatter="bigNum" data-footer-formatter="totalPriceNoStyle">Total Cost</th>
                            <th data-field="quantity" data-sortable="true">Qty</th>
                            <th data-field="day_val" data-footer-formatter="totalPrice" data-cell-style="cellStyle"
                                data-sortable="true">Day's Value</th>
                            <th data-field="gain" data-formatter="roundPercent" data-footer-formatter="gainTotal"
                                data-cell-style="cellStyle" data-sortable="true">Gain %</th>
                            <th data-field="total_change" data-footer-formatter="totalPrice" data-formatter="bigNum"
                                data-cell-style="cellStyle" data-sortable="true">Profit/Loss</th>
                            <th data-field="total_val" data-footer-formatter="totalPrice" data-formatter="bigNum"
                                data-sortable="true">Value</th>
                            <th data-visible="false" data-field="weight" data-formatter="roundPercent"
                                data-sortable="true">Weight</th>
                        </tr>
                    </thead>
                    <tbody class="table-group-divider"></tbody>
                    <tfoot class="table-group-divider"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="editWatchListModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable" role="document">
            <div class="modal-content shadow">
                <div class="modal-header py-2 px-3 bg-body-tertiary">
                    <h5 class="modal-title fs-6 fw-bold" id="editModalLabel">
                        <i class="fas fa-list-check me-2 text-primary"></i>Edit Watch List
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3">
                    <div class="d-flex justify-content-end align-items-center mb-3">
                        <button type="button" class="btn btn-success btn-sm px-3" id="addItemBtn">
                            <i class="fas fa-plus me-1"></i>Add Symbol
                        </button>
                    </div>
                    <ul id="listItems" class="list-group list-group-flush mb-0"></ul>
                    <div id="watchlistEmptyState" class="text-center py-4 text-body-secondary" style="display: none;">
                        <i class="fas fa-layer-group fa-2x mb-2 opacity-50"></i>
                        <p class="mb-0 small">No symbols in watchlist. Click "Add Symbol" to add one.</p>
                    </div>
                </div>
                <div class="modal-footer py-2 px-3 bg-body-tertiary d-flex justify-content-between align-items-center">
                    <div>
                        <span id="successMessage" class="badge text-bg-success py-2 px-3 small" style="display: none;">
                            <i class="fas fa-check-circle me-1"></i>Saved successfully
                        </span>
                        <span id="errorMessage" class="badge text-bg-danger py-2 px-3 small" style="display: none;">
                            <i class="fas fa-exclamation-circle me-1"></i>Failed to save
                        </span>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary btn-sm px-3" id="saveChanges">
                            <i class="fas fa-save me-1"></i>Save changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="js/jquery.min.js"></script>
    <script src="js/popper.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/bootstrap-table.min.js"></script>
    <!-- auto refresh ext -->
    <script src="js/bootstrap-table-auto-refresh.min.js"></script>
    <!-- export ext -->
    <script type="text/javascript" src="js/xlsx.full.min.js"></script>
    <script src="js/tableExport.min.js"></script>
    <script src="js/bootstrap-table-export.min.js"></script>
    <script src="js/chart.umd.min.js"></script>
    <script src="js/moment-with-locales.min.js"></script>
    <script src="js/chartjs-adapter-moment.min.js"></script>
    <script src="js/bootstrap-table-sticky-header.min.js"></script>
    <script src="js/table.js"></script>
    <script src="js/edit-watchlist.js"></script>
    <script src="js/trendschart.js"></script>
    <script src="js/darkmode.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
