[project]
name = "meitav-view"
dynamic = ["version"]
description = ""
authors = [{name = "Nicola Kalak", email ="nicolas12345@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "curl-cffi (>=0.16.0,<0.17.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)",
    "pandas-stubs (>=3.0.5.260730,<4.0.0.0)",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "httpx>=0.28.1",
]

[project.scripts]
meitav_view = "meitav_view.app:main"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[tool.hatch.build.targets.wheel]
packages = ["src/meitav_view"]

[dependency-groups]
test = [
    "pytest (>=9.0.0)",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-md-report>=0.8.0",
    "httpx2>=2.12.0",
]
lint = [
    "ruff (>=0.13.1)",
    "mypy (>=1.18.2,<2.0.0)"
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "tox",
]

[tool.ruff]
line-length = 120
target-version = "py312"
lint.select = ["E", "F", "B", "I", "N", "C", "S", "PL", "RUF"]
lint.ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
