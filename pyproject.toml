[project]
name = "meitav-view"
dynamic = ["version"]
description = ""
authors = [{name = "Nicola Kalak", email ="nicolas12345@gmail.com"}]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "lxml (>=6.1.3,<7.0.0)",
    "curl-cffi>=0.17.0,<0.18.0",
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
meitav_view = "meitav_view.app:main"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[tool.hatch.build.targets.wheel]
packages = ["src/meitav_view"]
artifacts = ["src/meitav_view/static/**"]
exclude = ["**/__pycache__", "**/*.pyc"]

[dependency-groups]
test = [
    "pytest (>=9.2.0)",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "httpx2>=2.16.0",
]
lint = [
    "ruff (>=0.17.5)",
    "mypy>=2.4.1,<3.0.0",
    "types-requests (>=2.33.0.20261030,<3.0.0.0)",
    "pandas-stubs (>=3.1.0.261029,<4.0.0.0)",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.ruff]
line-length = 120
target-version = "py314"
lint.select = ["E", "F", "B", "I", "N", "C", "S", "PL", "RUF"]
lint.ignore = []

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
