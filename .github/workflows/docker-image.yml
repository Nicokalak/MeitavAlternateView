name: Docker Build and Publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/meitav-alternate-view

permissions:
  contents: read

jobs:
  quality_check:
    name: Quality Check & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so git describe --tags works correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Validate UI Build
        run: |
          cd ui
          npm ci
          npm run build

      - name: Run Python quality checks
        run: |
          echo "--- Running Quality Checks ---"
          uv run ruff check src
          uv run ruff format --check src
          uv run mypy src
          uv run pytest
          echo "--- Quality Checks Passed! ---"


  build_package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: quality_check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history required for git describe --tags (used by hatch-vcs)
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Show resolved version
        run: |
          echo "Git describe: $(git describe --tags)"
          uv run python -c "import importlib.metadata; print('Package version:', importlib.metadata.version('meitav-view'))"

      - name: Build wheel & sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 7


  build_and_push:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: quality_check
    # Runs on all triggers; push is skipped on PRs (build-only validation)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up QEMU (for multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Resolve app version
        id: version
        run: echo "value=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
