default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: (^|/)(uv\.lock|package-lock\.json)$|\.min\.(js|css)$
      - id: trailing-whitespace
        exclude: (^|/)(uv\.lock|package-lock\.json)$|\.min\.(js|css)$

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        files: ^src/
        pass_filenames: false

      - id: vue-tsc
        name: vue-tsc
        entry: npm --prefix ui run typecheck
        language: system
        files: ^ui/
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      - id: vitest
        name: vitest
        entry: npm --prefix ui test
        language: system
        stages: [pre-push]
        files: ^ui/
        pass_filenames: false
